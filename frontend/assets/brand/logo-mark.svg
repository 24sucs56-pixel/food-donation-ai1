<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e11d48"/>
            <stop offset="100%" stop-color="#be123c"/>
        </linearGradient>
        <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#059669"/>
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
        </filter>
    </defs>
    
    <rect width="120" height="120" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>
    
    <!-- Bowl -->
    <path d="M 25,62 A 35,35 0 0,0 95,62 Z" fill="#ffffff"/>
    
    <!-- Heart / Leaf -->
    <path d="M 60,55 C 60,55 35,30 35,20 C 35,5 55,0 60,15 C 65,0 85,5 85,20 C 85,30 60,55 60,55 Z" fill="url(#heartGrad)"/>
    
    <!-- Smart Nodes -->
    <circle cx="43" cy="74" r="4" fill="#be123c"/>
    <circle cx="60" cy="83" r="4" fill="#be123c"/>
    <circle cx="77" cy="74" r="4" fill="#be123c"/>
    <path d="M 43,74 L 60,83 L 77,74" fill="none" stroke="#be123c" stroke-width="2.5" stroke-linecap="round"/>
</svg>

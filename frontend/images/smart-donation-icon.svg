<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background App Tile (Rounded Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Geometry Accent Ring -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2.5" stroke-dasharray="10 10" />

  <!-- SYMBOL: Merged Food Bowl + Heart + Leaf + AI Node -->
  <g transform="translate(0, 4)">
    <!-- Outer Leaf & Bowl Base (Emerald Arc) -->
    <path d="M 256 372 
             C 165 372, 112 300, 112 212 
             C 112 152, 154 120, 198 120 
             C 226 120, 246 136, 256 154 
             C 244 132, 214 104, 168 104 
             C 110 104, 72 154, 72 228 
             C 72 344, 162 408, 256 408 
             Z" 
          fill="url(#emeraldGrad)" />

    <!-- Outer Leaf & Bowl Base (Teal Arc) -->
    <path d="M 256 372 
             C 347 372, 400 300, 400 212 
             C 400 152, 358 120, 314 120 
             C 286 120, 266 136, 256 154 
             C 268 132, 298 104, 344 104 
             C 402 104, 440 154, 440 228 
             C 440 344, 350 408, 256 408 
             Z" 
          fill="url(#tealGrad)" />

    <!-- Central Interlocking Heart-Bowl Core -->
    <path d="M 256 352 
             C 188 352, 140 294, 140 220 
             C 140 170, 176 138, 216 138 
             C 238 138, 250 152, 256 164 
             C 262 152, 274 138, 296 138 
             C 336 138, 372 170, 372 220 
             C 372 294, 324 352, 256 352 Z" 
          fill="url(#emeraldGrad)" opacity="0.95" />

    <!-- Negative Space Heart Arc Highlight -->
    <path d="M 256 322 
             C 204 322, 166 276, 166 218 
             C 166 178, 194 156, 222 156 
             C 240 156, 251 168, 256 178 
             C 261 168, 272 156, 290 156 
             C 318 156, 346 178, 346 218 
             C 346 276, 308 322, 256 322 Z" 
          fill="#022c22" />

    <!-- AI Intelligence Core (Glowing Amber Node at Heart Center) -->
    <circle cx="256" cy="222" r="24" fill="url(#amberGrad)" filter="url(#subtleGlow)"/>
    <circle cx="256" cy="222" r="13" fill="#ffffff" opacity="0.95"/>
    <circle cx="256" cy="222" r="5" fill="#d97706"/>

    <!-- Subtle AI Circuit Accent Nodes -->
    <line x1="256" y1="198" x2="256" y2="166" stroke="url(#amberGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="256" y1="246" x2="256" y2="278" stroke="url(#amberGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="256" cy="164" r="4.5" fill="#fbbf24"/>
    <circle cx="256" cy="280" r="4.5" fill="#fbbf24"/>
  </g>
</svg>
